name: Android

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The library and its JVM tests. The sample app builds too, so a change
      # that breaks the public API is caught here rather than by whoever
      # integrates the SDK next.
      - run: ./gradlew :livechat:assembleRelease :livechat:testReleaseUnitTest :sample:assembleDebug
